# Release flow: show what each env runs and the state of every pick label.
name: Release status

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  deployments: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/release.py status
