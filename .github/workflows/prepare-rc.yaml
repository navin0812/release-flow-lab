# Release flow: sync release/vX.Y to its pick label and tag the next rc.
# Drafts the pre-release; publishing it starts "On release" (image build).
name: Prepare rc
run-name: Prepare rc v${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to prepare, X.Y.Z (picks label pick/release/vX.Y)"
        type: string
        required: true
      dry_run:
        description: "Show what would change; push nothing"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write # create picked/ and pick-conflict/ labels
  deployments: read

concurrency:
  group: release-manager
  cancel-in-progress: false

jobs:
  prepare-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare rc
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANAGERS: ${{ vars.RELEASE_MANAGERS }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python3 -I .github/scripts/release.py prepare-rc "$VERSION" $DRY_RUN
