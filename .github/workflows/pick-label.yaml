# Pick label: every open PR to main needs a pick decision, so it is clear which
# release it ships in. The label must start with pick/release/ (the rest can be
# anything, e.g. pick/release/v2.40.0) and the branch release/<same part> must
# exist (label and branch match 1:1). Or the label is pick/none (stays on main
# only; it cannot be combined with a release label). The check adds no labels:
# a person picks. Creating a branch starts no run: re-run the check after it.
# The Pick workflow later cherry-picks the PRs that carry the label.
name: Pick label

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {} # the job sets its own

jobs:
  pick-label:
    # Label edits on merged PRs (to drop them from a release) must not re-run the check.
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the script, look up the release branch
      pull-requests: read # read the labels
    steps:
      - uses: actions/checkout@v4
      - name: Check release label and branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 -I .github/scripts/pick_label.py
