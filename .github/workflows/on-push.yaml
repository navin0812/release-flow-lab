# Mirrors the production repo's .github/workflows/on-push.yaml.
# Every difference from the real file is marked "lab:".
name: On push

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  id-token: write
  packages: write # lab: images go to GHCR instead of ECR
  deployments: write # lab: ecs_deploy stand-in records what each env runs

jobs:
  build-x86:
    runs-on:
      - ubuntu-latest # lab: real runner is a self-hosted org runner
    outputs:
      tags: ${{ steps.docker-build-push.outputs.tags }}
    steps:
      - uses: actions/checkout@v4 # lab: needed to load the local stand-in action
      - name: Build Docker image
        id: docker-build-push
        uses: ./.github/actions/docker_build_push # lab: real is the org's docker_build_push action @v2
        with:
          docker_meta_tags: type=raw,value={{sha}},prefix=sha-${{ github.run_number }}-,suffix=-amd64
          docker_build_context: ${{ github.workspace }}
          docker_build_platforms: linux/amd64
          dockerfile_path: ${{ github.workspace }}/Dockerfile
          ecr_registries: "unused" # lab: real value lists the ECR account IDs
          ecr_uri: ${{ vars.ECR_URI }}
          role_to_assume: ${{ vars.GHA_ROLE_ARN }}

  deploy:
    environment: dev
    needs: build-x86
    runs-on:
      - ubuntu-latest # lab: real runner is a self-hosted org runner
    steps:
      - uses: actions/checkout@v4 # lab: needed to load the local stand-in action
      - name: Deploy ECS with CodeDeploy
        uses: ./.github/actions/ecs_deploy # lab: real is the org's ecs_deploy action @v2
        with:
          cluster_name: ${{ vars.CLUSTER_NAME }}
          container_name: ${{ vars.CONTAINER_NAME }}
          image_uri: ${{ needs.build-x86.outputs.tags }}
          role_to_assume: ${{ vars.DEPLOYER_ROLE_ARN }}
          service_name: ${{ vars.SERVICE_NAME }}
          taskdef_path: ${{ vars.TASKDEF_PATH }}

  register_deploy_dx:
    if: ${{ success() || failure() }}
    needs: deploy
    runs-on:
      - ubuntu-latest # lab: real runner is a self-hosted org runner
    steps:
      - uses: actions/checkout@v4 # lab: needed to load the local stand-in action
      - name: Register deployment
        uses: ./.github/actions/register_deploy_dx # lab: real is the org's register_deploy_dx action @c2e86b6 (v3.0.2)
        with:
          app_category: web
          deploy_success: ${{ needs.deploy.result == 'success' }}
          env: dev
          product_name: Lab
          service: Release Flow Lab
          dts_base_url: ${{ vars.DTS_BASE_URL }}
          dts_api_token: ${{ secrets.DTS_API_TOKEN }}
