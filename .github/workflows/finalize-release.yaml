# Release flow: tag vX.Y.Z on the commit prd runs (the rc that passed UAT).
# Drafts the release; publish it to move "Latest".
name: Finalize release
run-name: Finalize v${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version prd runs an rc of, X.Y.Z"
        type: string
        required: true
      dry_run:
        description: "Show what would change; push nothing"
        type: boolean
        default: true

permissions:
  contents: write
  deployments: read

concurrency:
  group: release-manager
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANAGERS: ${{ vars.RELEASE_MANAGERS }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python3 -I .github/scripts/release.py finalize "$VERSION" $DRY_RUN
