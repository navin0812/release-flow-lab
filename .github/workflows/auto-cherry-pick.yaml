# auto-cherry-pick: cherry-pick the merged PRs that carry a label onto a branch.
#   label PRs pick/<branch> (or any label, via the label input)
#   run this workflow: the picked PRs show in the run summary
# One run does all of it or nothing: a conflict, or a PR that changes workflow
# files, stops the run and pushes nothing. Tag and release in the GitHub UI.
#
# Every run goes through a gate: it shows a preview (dry run), then waits.
# Open the run, click "Review deployments", approve "pick-confirm" to pick for
# real with the same inputs. Reject to stop: the preview is all you get.
# The real run reads the labels again, so it can differ from the preview if a
# PR was merged or labelled in between.
# One-time setup: environment "pick-confirm" with Required reviewers.
name: auto-cherry-pick
run-name: auto-cherry-pick onto ${{ inputs.branch }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to pick onto, e.g. feature/CRAH-4536 or release/v2.40.0. It must exist."
        type: string
        required: true
      label:
        description: "Label that selects the PRs. Empty: pick/<branch>"
        type: string
        required: false
        default: ""
      exclude_prs:
        description: "Merged PR numbers to skip in this run, e.g. 12,15"
        type: string
        required: false
        default: ""

permissions: {} # the jobs set their own

concurrency:
  group: pick-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  # Fail early, before any pick: without required reviewers the confirm job
  # would pass at once and the real pick would run with no click.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check environment pick-confirm has required reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/pick-confirm" --jq '.protection_rules[].type' | grep -qx required_reviewers; then
            echo "::error::Environment pick-confirm is missing or has no required reviewers. Create it (Settings > Environments) before running this workflow."
            exit 1
          fi

  preview:
    needs: guard
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/pick-run.yaml
    with:
      branch: ${{ inputs.branch }}
      label: ${{ inputs.label }}
      exclude_prs: ${{ inputs.exclude_prs }}
      dry_run: true

  # The button: this job waits until a required reviewer approves it.
  confirm:
    needs: preview
    runs-on: ubuntu-latest
    environment: pick-confirm
    permissions: {}
    steps:
      - run: echo "Approved. Picking for real."

  pick:
    needs: confirm
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/pick-run.yaml
    with:
      branch: ${{ inputs.branch }}
      label: ${{ inputs.label }}
      exclude_prs: ${{ inputs.exclude_prs }}
      dry_run: false
